<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NT Tech Innovation</title>
    <script>
      try {
        var raw = localStorage.getItem("language");
        var l = raw;
        try { l = JSON.parse(raw); } catch (e) {}
        if (l === "bn" || l === "en") document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
